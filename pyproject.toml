[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "libxckernel"
version = "0.1.0"
description = "An automatic-differentiation backend for Libxc: generate arbitrary exchange-correlation kernel elements in LCAO basis sets"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Susi Lehtola", email = "susilehtola@gmail.com" },
]
dependencies = [
    "sympy>=1.12",
    "numpy>=1.24",
]

[project.optional-dependencies]
# The validation suites additionally need pylibxc, which is not
# installable from PyPI (the "pylibxc2" name there is an unrelated empty
# stub): it ships with Libxc itself, e.g. the conda-forge "libxc"
# package or the Fedora "python3-libxc" RPM.
# validation suites
test = ["pyscf>=2.10", "scipy"]

[tool.setuptools.packages.find]
include = ["xckernel*"]
